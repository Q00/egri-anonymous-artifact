[project]
name = "egri"
version = "0.1.0"
description = "Anonymous reproducibility artifact for Evidence-Gated Recursive Inference."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Anonymous Authors" }]
readme = "README.md"
keywords = [
  "recursive-language-model",
  "rlm",
  "agent-runtime",
  "evidence-gating",
  "long-context",
]

dependencies = [
  "ouroboros-ai==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]
live = [
  "claude-agent-sdk>=0.1.0,<1.0.0",
]

[project.scripts]
runtime-scaffold = "egri.runtime_cli:main"
egri-replay = "egri.replay:main"
egri-live-portability = "egri.live_portability:main"
egri-generate-artifacts = "egri.benchmarks.experiment_artifacts:main"

[project.urls]
Artifact = "URL omitted for anonymous review"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egri"]
